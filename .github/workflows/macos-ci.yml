name: macOS CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "macos/**"
      - ".github/workflows/macos-ci.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-ci.yml"
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  release:
    name: Package and release
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check packaging script exists
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ ! -f macos/scripts/build-app.sh ]; then
            echo "::error::macos/scripts/build-app.sh is missing; cannot build the release assets."
            exit 1
          fi
          version="$(tr -d '[:space:]' < macos/VERSION)"
          if [ "$IS_TAG" = "true" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Release tag does not match macos/VERSION."
            exit 1
          fi

      - name: Build app zip and dmg
        working-directory: macos
        run: |
          chmod +x scripts/build-app.sh
          scripts/build-app.sh --zip --dmg

      - name: Verify universal app and signature
        run: |
          lipo -verify_arch arm64 x86_64 "macos/build/Alive for Mac.app/Contents/MacOS/AliveForMac"
          codesign --verify --deep --strict "macos/build/Alive for Mac.app"

      - name: Locate zip and dmg
        id: pkg
        run: |
          zip="$(ls macos/dist/AliveForMac-*.zip 2>/dev/null | head -n 1 || true)"
          dmg="$(ls macos/dist/AliveForMac-*.dmg 2>/dev/null | head -n 1 || true)"
          if [ -z "$zip" ]; then
            echo "::error::build-app.sh --zip did not produce macos/dist/AliveForMac-<version>.zip"
            exit 1
          fi
          if [ -z "$dmg" ]; then
            echo "::error::build-app.sh --dmg did not produce macos/dist/AliveForMac-<version>.dmg"
            exit 1
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "Built $zip and $dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.pkg.outputs.zip }}
          DMG_PATH: ${{ steps.pkg.outputs.dmg }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            tag="$REF_NAME"
          else
            # workflow_dispatch on a branch: derive the tag from the zip name (AliveForMac-<version>.zip)
            version="$(basename "$ZIP_PATH" .zip)"
            tag="v${version#AliveForMac-}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP_PATH" "$DMG_PATH" --clobber
          else
            gh release create "$tag" "$ZIP_PATH" "$DMG_PATH" \
              --target "$GITHUB_SHA" \
              --title "Alive for Mac $tag" \
              --generate-notes
          fi
